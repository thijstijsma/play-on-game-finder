<style>
/* Layout: a handheld-menu wall of big picture tiles; tap one to open its card. Single dark "neon box" look, like the HEMA Play On packaging. */
:root {
  color-scheme: dark;
  --night: #14123a;
  --panel: #1f1c52;
  --panel-2: #2a2668;
  --ink: #f3f0ff;
  --muted: #b7b0e6;
  --pink: #ff3d8b;
  --cyan: #45d6ff;
  --violet: #8b4dff;
  --font-pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  background: var(--night);
  background-image: radial-gradient(ellipse at 15% -10%, rgba(139,77,255,.35), transparent 55%), radial-gradient(ellipse at 100% 0%, rgba(255,61,139,.22), transparent 45%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--font-pixel); font-weight: 700; font-size: clamp(28px, 6vw, 46px); margin: 0; letter-spacing: .02em; line-height: 1; text-shadow: 0 0 18px rgba(69,214,255,.55); color: var(--ink); }
h1 span { color: var(--pink); text-shadow: 0 0 18px rgba(255,61,139,.6); }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; background: var(--panel); border: 2px solid var(--panel-2); border-radius: 999px; padding: 3px; }
.lang button { font: inherit; font-weight: 800; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--cyan); color: var(--night); }
.lang button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(20,18,58,.92); backdrop-filter: blur(8px); padding-block: 10px; display: grid; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
.search { display: flex; gap: 10px; flex-wrap: wrap; }
.search input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 18px; color: var(--ink); background: var(--panel); border: 2px solid var(--panel-2); border-radius: 12px; padding: 10px 14px; }
.search input:focus { outline: none; border-color: var(--cyan); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; font: inherit; font-weight: 700; color: var(--ink); background: var(--panel); border: 2px solid var(--panel-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .e { font-size: 22px; line-height: 1; }
.chip[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }
.chip:focus-visible, .tile:focus-visible, .x:focus-visible, .star:focus-visible, .nav:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.count { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.tile { all: unset; cursor: pointer; display: grid; grid-template-rows: auto auto; background: var(--panel); border-radius: 14px; overflow: hidden; border: 2px solid transparent; transition: transform .12s ease, border-color .12s ease; position: relative; }
.tile:hover { transform: translateY(-3px); border-color: var(--violet); }
.shot { aspect-ratio: 16 / 15; background: #000; display: grid; place-items: center; position: relative; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.shot .big { font-size: 64px; }
.num { position: absolute; top: 6px; left: 6px; font-family: var(--font-pixel); font-weight: 700; font-size: 22px; background: var(--pink); color: #fff; border-radius: 8px; padding: 2px 8px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.emo { position: absolute; bottom: 6px; right: 6px; font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
.fav { position: absolute; top: 6px; right: 8px; font-size: 22px; }
.meta { padding: 8px 10px 10px; display: grid; gap: 2px; min-width: 0; }
.name { font-weight: 800; font-size: 17px; line-height: 1.15; overflow-wrap: anywhere; }
.kid { color: var(--muted); font-size: 14px; line-height: 1.25; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
dialog { border: none; padding: 0; background: var(--panel); color: var(--ink); border-radius: 18px; width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; }
dialog::backdrop { background: rgba(8,6,30,.75); }
.card { display: grid; gap: 12px; padding: 0 0 18px; }
.card .shot { aspect-ratio: 16 / 15; }
.card .shot .big { font-size: 120px; }
.card .num { font-size: 34px; top: 10px; left: 10px; padding: 4px 12px; }
.card .body { padding: 0 18px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-size: 28px; line-height: 1.1; text-wrap: balance; display: flex; gap: 10px; align-items: center; }
.card .say { font-size: 21px; font-weight: 700; color: var(--cyan); margin: 0; }
.card .how { margin: 0; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--panel-2); border-radius: 999px; padding: 2px 10px; }
.tag.low { color: #ffcf5a; border-color: #6b5520; }
.row { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 0 18px; flex-wrap: wrap; }
.x, .star, .nav { font: inherit; font-weight: 800; cursor: pointer; border-radius: 12px; border: 2px solid var(--panel-2); background: var(--panel-2); color: var(--ink); padding: 8px 14px; }
.star[aria-pressed="true"] { background: #ffcf5a; color: #2a1d00; border-color: #ffcf5a; }
.x { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(20,18,58,.85); }
.navs { display: flex; gap: 8px; }
footer { color: var(--muted); font-size: 14px; display: grid; gap: 6px; max-width: 75ch; }
footer a { color: var(--cyan); }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .kid { display: none; } .num { font-size: 18px; } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
</style>

function open(i) {
  openIdx = i; const g = shown[i]; if (!g) return;
  const tags = [[t().kinds[g.kind]], [g.based_on ? t().like(g.based_on) : ""], [g.dup_of ? t().same(g.dup_of) : ""], [g.confidence === "low" ? t().guess : "", "low"], [g.file && g.pic_original ? t().orig : ""]]
    .filter(([x]) => x).map(([x, c]) => `<span class="tag${c ? " " + c : ""}">${esc(x)}</span>`).join("");
  $("#card").innerHTML = `<div class="card"><div style="position:relative">${shot(g, true)}<button class="x" id="close">${t().close}</button></div>
    <div class="body"><h2><span aria-hidden="true">${g.emoji}</span>${esc(g.name)}</h2><p class="say">${esc(kid(g))}</p><p class="how">${esc(how(g))}</p><div class="tags">${tags}</div></div>
    <div class="row"><button class="star" id="star" aria-pressed="${favs.has(g.n)}">${favs.has(g.n) ? t().fav : t().addFav}</button>
    <div class="navs"><button class="nav" id="prev" ${i === 0 ? "disabled" : ""} aria-label="${t().prev}">◀</button><button class="nav" id="next" ${i === shown.length - 1 ? "disabled" : ""} aria-label="${t().next}">▶</button></div></div></div>`;
  const d = $("#dlg"); if (!d.open) d.showModal();
}
document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.lang; store.set("lang", lang); applyLang(); });
$("#grid").addEventListener("click", e => { const el = e.target.closest(".tile"); if (el) open(+el.dataset.i); });
$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; kind = c.dataset.k; renderChips(); render(); });
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#card").addEventListener("click", e => {
  const id = e.target.closest("button")?.id;
  if (id === "close") $("#dlg").close();
  if (id === "prev" && openIdx > 0) open(openIdx - 1);
  if (id === "next" && openIdx < shown.length - 1) open(openIdx + 1);
  if (id === "star") { const n = shown[openIdx].n; favs.has(n) ? favs.delete(n) : favs.add(n); store.set("favs", JSON.stringify([...favs])); render(); if (!shown.length) { $("#dlg").close(); return; } open(Math.min(openIdx, shown.length - 1)); }
});
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
document.addEventListener("keydown", e => { if (!$("#dlg").open) return; if (e.key === "ArrowRight" && openIdx < shown.length - 1) open(openIdx + 1); if (e.key === "ArrowLeft" && openIdx > 0) open(openIdx - 1); });
applyLang();
</script>
